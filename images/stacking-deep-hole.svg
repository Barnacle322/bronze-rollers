      <rect x="0.5" y="0.5" width="27" height="27" stroke="black" stroke-opacity="0.14"/>
      <rect x="0" y="0" width="3" height="28" fill="white" fill-opacity="0.1"/>
      <rect x="25" y="0" width="3" height="28" fill="black" fill-opacity="0.14"/>
